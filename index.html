<style>
  :root{--ink:#101828;--ink2:#475467;--line:#e4e8ee;--brand:#0f5ea8}
  *{box-sizing:border-box}
  body{margin:0;background:#f4f6f9;color:var(--ink);

  header{background:linear-gradient(158deg,#08243c 0%,#0d4a80 58%,#0a6a96 100%);color:#fff;padding:40px 0 44px}
  header .wrap{padding-top:0;padding-bottom:0}
  .eyebrow{display:inline-block;margin:0 0 12px;padding:5px 12px;border-radius:999px;

  .card b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}

  </div>

<main class="wrap">
  <a class="card" href="/lens-calc/">
    <b>안경두께 비교 · 렌즈 압축 계산기</b>
